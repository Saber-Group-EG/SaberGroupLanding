<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/S%20ICON.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Saber Group is a marketing and creative agency in Tanta, Egypt: social media management, video production, photography, branding and web development."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sabergroup-eg.com/" />
    <meta
      property="og:title"
      content="Saber Group | Marketing & Creative Agency in Tanta, Egypt"
    />
    <meta
      property="og:description"
      content="Social media management, video production, photography, branding and web development from Tanta, Egypt."
    />
    <meta property="og:site_name" content="Saber Group" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_EG" />
    <meta property="og:image" content="https://sabergroup-eg.com/S%20ICON.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Saber Group" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Saber Group | Marketing & Creative Agency in Tanta, Egypt"
    />
    <meta
      name="twitter:description"
      content="Social media management, video production, photography, branding and web development from Tanta, Egypt."
    />
    <meta name="twitter:image" content="https://sabergroup-eg.com/S%20ICON.png" />

    <title>Saber Group | Marketing &amp; Creative Agency in Tanta, Egypt</title>

    <!--
      Readable fallback written into #root by scripts/prerender.mjs and
      middleware.js for crawlers and AI assistants. React replaces it on boot;
      it only becomes visible if the app hasn't started after 2s.
    -->
    <style>
      .seo-static {
        opacity: 0;
        animation: seo-static-reveal 0s 2s forwards;
        max-width: 880px;
        margin: 0 auto;
        padding: 32px 16px;
        font: 16px/1.6 system-ui, sans-serif;
        color: #111315;
      }
      .seo-static nav ul { display: flex; flex-wrap: wrap; gap: 16px; list-style: none; padding: 0; }
      .seo-static a { color: #e5192d; }
      @keyframes seo-static-reveal { to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.jsx"></script>
  </body>
</html>
